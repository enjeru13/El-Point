name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (tsc + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint (falla solo con errores; los warnings no bloquean)
        run: npx eslint . --quiet

  admin-web:
    name: Panel admin (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - name: Typecheck + build
        run: npm run build
        env:
          # Solo para que el build compile; no son secretos ni se usan en runtime.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_KEY: ci-placeholder
