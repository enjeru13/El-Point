<!doctype html>
<html lang="es-VE">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deja tu rank en El Point</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#c8451f" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand: #c8451f; --bg: #fdf8f6; --surface: #ffffff; --text: #241a16; --soft: #6b5b52; --border: #e6d8d0;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --brand: #ff7043; --bg: #0b0b0d; --surface: #141417; --text: #f4f4f5; --soft: #a9a9b0; --border: #34343b; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--text); font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }
    .card {
      width: min(420px, 100%); text-align: center; background: var(--surface);
      border: 1px solid var(--border); border-radius: 24px; padding: 32px 24px;
    }
    img.logo { height: 56px; width: auto; margin-bottom: 16px; }
    h1 { font-family: Outfit, system-ui, sans-serif; font-weight: 800; font-size: 1.7rem; line-height: 1.1; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: var(--soft); line-height: 1.5; }
    .btn {
      display: block; width: 100%; padding: 14px 18px; border-radius: 999px; font-weight: 700; font-size: 1rem;
      text-decoration: none; background: var(--brand); color: #fff;
    }
    .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); margin-top: 10px; }
    .note { margin: 18px 0 0; font-size: 0.85rem; }
  </style>
</head>
<body>
  <main class="card">
    <picture>
      <source srcset="../assets/logo-pin-dark.png" media="(prefers-color-scheme: dark)" />
      <img class="logo" src="../assets/logo-pin.png" alt="" />
    </picture>
    <h1 id="title">Abriendo El Point…</h1>
    <p id="body">Si la app está instalada, se abre sola en este local para que dejes tu rank.</p>
    <a id="open" class="btn" href="#">Abrir en la app</a>
    <a class="btn ghost" href="../">Conocer El Point</a>
    <p class="note" id="note">¿Aún no la tienes? Muy pronto en App Store.</p>
  </main>

  <script>
    (function () {
      var id = new URLSearchParams(location.search).get("id") || "";
      var valid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id);
      var open = document.getElementById("open");
      if (!valid) {
        document.getElementById("title").textContent = "Enlace no válido";
        document.getElementById("body").textContent = "Este código QR no corresponde a ningún local. Escanéalo de nuevo o pídele otro al local.";
        open.style.display = "none";
        return;
      }
      // rank=1 hace que la app abra directo la hoja para dejar el rank.
      var link = "elpoint://restaurant/" + id + "?rank=1";
      open.href = link;
      setTimeout(function () { window.location.href = link; }, 250);
      setTimeout(function () {
        document.getElementById("title").textContent = "Deja tu rank en El Point";
        document.getElementById("body").textContent = "Toca el botón para abrir el local en la app.";
      }, 1500);
    })();
  </script>
</body>
</html>
