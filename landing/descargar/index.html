<!doctype html>
<html lang="es-VE">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Descarga El Point</title>
  <meta name="description" content="Descubre dónde comer en San Cristóbal. Descarga El Point gratis." />
  <meta name="theme-color" content="#c8451f" />
  <meta property="og:title" content="Descarga El Point" />
  <meta property="og:description" content="Descubre dónde comer en San Cristóbal." />
  <meta property="og:image" content="https://elpoint-app.netlify.app/assets/og.png" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand: #c8451f; --bg: #fdf8f6; --surface: #ffffff; --text: #241a16; --soft: #6b5b52; --border: #e6d8d0;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --brand: #ff7043; --bg: #0b0b0d; --surface: #141417; --text: #f4f4f5; --soft: #a9a9b0; --border: #34343b; }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--text); font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }
    .card {
      width: min(420px, 100%); text-align: center; background: var(--surface);
      border: 1px solid var(--border); border-radius: 24px; padding: 32px 24px;
    }
    img.logo { height: 56px; width: auto; margin-bottom: 16px; }
    h1 { font-family: Outfit, system-ui, sans-serif; font-weight: 800; font-size: 1.7rem; line-height: 1.1; margin: 0 0 8px; }
    p { margin: 0 0 22px; color: var(--soft); line-height: 1.5; }
    .stores { display: grid; gap: 12px; justify-items: center; }
    .stores a { display: inline-block; }
    .stores img { height: 52px; width: auto; display: block; }
    .soon { margin: 4px 0 0; font-size: 0.85rem; }
    .more { display: inline-block; margin-top: 22px; color: var(--brand); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <picture>
      <source srcset="../assets/logo-pin-dark.png" media="(prefers-color-scheme: dark)" />
      <img class="logo" src="../assets/logo-pin.png" alt="" />
    </picture>
    <h1>Descarga El Point</h1>
    <p>Descubre dónde comer en San Cristóbal: menús, precios en $, Bs o COP y pedidos por WhatsApp.</p>
    <div class="stores">
      <a id="ios" href="https://apps.apple.com/ve/app/el-point/id6826337907">
        <img src="../assets/appstore-es.svg" alt="Descargar en el App Store" />
      </a>
      <a id="android" href="https://play.google.com/store/apps/details?id=com.elpoint.app" hidden>
        <img src="../assets/googleplay-es.svg" alt="Disponible en Google Play" />
      </a>
      <p class="soon" id="soon">Muy pronto en Google Play.</p>
    </div>
    <a class="more" href="../">Conocer El Point</a>
  </main>

  <script>
    // El QR impreso apunta aquí, no a la tienda: así un mismo código sirve
    // para iPhone y Android, y si cambia un enlace no hay que reimprimir.
    (function () {
      // Cambiar a true cuando la app esté publicada en Google Play.
      var ANDROID_PUBLIC = false;

      var ua = navigator.userAgent || "";
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/i.test(ua);
      var ios = document.getElementById("ios").href;
      var android = document.getElementById("android");

      if (ANDROID_PUBLIC) {
        android.hidden = false;
        document.getElementById("soon").hidden = true;
      }
      if (isIOS) location.replace(ios);
      else if (isAndroid && ANDROID_PUBLIC) location.replace(android.href);
    })();
  </script>
</body>
</html>
